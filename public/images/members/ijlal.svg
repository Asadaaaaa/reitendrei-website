      <stop offset="0%" stop-color="#2d0612" />
      <stop offset="60%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#ijlalBg)" />
  <circle cx="300" cy="280" r="130" fill="#fb7185" opacity="0.1" />
