<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="zarelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#zarelBg)" />
  <circle cx="300" cy="280" r="130" fill="#38bdf8" opacity="0.1" />
  <!-- Stylized Drum Kit & Sticks Silhouette -->
  <g transform="translate(300, 360)" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
    <!-- Cymbals -->
    <ellipse cx="-100" cy="-120" rx="60" ry="15" />
    <ellipse cx="100" cy="-140" rx="70" ry="18" />
    <!-- Drums -->
    <rect x="-70" y="-70" width="60" height="60" rx="6" fill="#0f172a" />
    <rect x="10" y="-70" width="60" height="60" rx="6" fill="#0f172a" />
    <rect x="-90" y="20" width="180" height="100" rx="12" fill="#0f172a" stroke="#ff4d29" stroke-width="5" />
    <!-- Drumsticks -->
    <line x1="-80" y1="-180" x2="20" y2="-40" stroke="#f59e0b" stroke-width="5" />
    <line x1="80" y1="-180" x2="-20" y2="-40" stroke="#f59e0b" stroke-width="5" />
  </g>
  <text x="300" y="640" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="28" letter-spacing="4">ZAREL KAKA PUTRAMA</text>
  <text x="300" y="675" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="14" letter-spacing="6">DRUMS &amp; PERCUSSION</text>
</svg>
